<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty API - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="./swagger-ui-dist/swagger-ui.css" />
  <link rel="icon" type="image/png" href="./swagger-ui-dist/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="./swagger-ui-dist/favicon-16x16.png" sizes="16x16" />
  <style>
    html
    {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *,
    *:before,
    *:after
    {
      box-sizing: inherit;
    }

    body
    {
      margin:0;
      background: #fafafa;
    }
  </style>
</head>
<body>
<div id="swagger-ui"></div>

<script src="./swagger-ui-dist/swagger-ui-bundle.js" charset="UTF-8"> </script>
<script src="./swagger-ui-dist/swagger-ui-standalone-preset.js" charset="UTF-8"> </script>
<script>
  window.onload = function() {
    // Begin Swagger UI call region
    const ui = SwaggerUIBundle({
      spec: {
  "openapi": "3.0.3",
  "info": {
    "title": "API REST Sistema de Reservas",
    "description": "API para gestionar reservas de recursos dentro del sistema de reservas.",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "http://localhost:8080/api/v1",
      "description": "Servidor local de desarrollo"
    }
  ],
  "paths": {
    "/reservas": {
      "get": {
        "summary": "Listar reservas",
        "description": "Devuelve todas las reservas registradas en el sistema.",
        "responses": {
          "200": {
            "description": "Lista de reservas obtenida correctamente",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Reserva"
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "Crear una reserva",
        "description": "Crea una nueva reserva para un recurso, usuario, fecha y horario determinados.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReservaInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Reserva creada correctamente",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Reserva"
                }
              }
            }
          },
          "400": {
            "description": "Datos inválidos o recurso no disponible",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/reservas/{id}": {
      "get": {
        "summary": "Obtener una reserva por ID",
        "description": "Devuelve los datos de una reserva concreta.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Identificador compuesto de la reserva.",
            "schema": {
              "type": "integer",
              "example": 202
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Reserva encontrada correctamente",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Reserva"
                }
              }
            }
          },
          "404": {
            "description": "Reserva no encontrada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "patch": {
        "summary": "Modificar una reserva",
        "description": "Modifica parcialmente los datos editables de una reserva.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Identificador compuesto de la reserva.",
            "schema": {
              "type": "integer",
              "example": 202
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReservaInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Reserva modificada correctamente",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Reserva"
                }
              }
            }
          },
          "400": {
            "description": "Datos inválidos",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Reserva no encontrada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "delete": {
        "summary": "Eliminar una reserva",
        "description": "Elimina una reserva existente.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "Identificador compuesto de la reserva.",
            "schema": {
              "type": "integer",
              "example": 202
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Reserva eliminada correctamente"
          },
          "404": {
            "description": "Reserva no encontrada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Reserva": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 202
          },
          "idReservaLocal": {
            "type": "integer",
            "example": 2
          },
          "idRecurso": {
            "type": "integer",
            "example": 2
          },
          "idUsuario": {
            "type": "integer",
            "example": 1
          },
          "fecha": {
            "type": "string",
            "format": "date",
            "example": "2026-06-15"
          },
          "horaInicio": {
            "type": "string",
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
            "example": "10:00"
          },
          "horaFin": {
            "type": "string",
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
            "example": "12:00"
          },
          "coste": {
            "type": "number",
            "format": "double",
            "minimum": 0,
            "example": 12
          },
          "numeroPlazas": {
            "type": "integer",
            "minimum": 1,
            "example": 4
          },
          "motivo": {
            "type": "string",
            "maxLength": 255,
            "example": "Reunión de equipo"
          },
          "observaciones": {
            "type": "string",
            "maxLength": 500,
            "example": "Se necesita proyector"
          }
        }
      },
      "ReservaInput": {
        "type": "object",
        "required": [
          "idRecurso",
          "idUsuario",
          "fecha",
          "horaInicio",
          "horaFin",
          "numeroPlazas"
        ],
        "properties": {
          "idRecurso": {
            "type": "integer",
            "example": 2
          },
          "idUsuario": {
            "type": "integer",
            "example": 1
          },
          "fecha": {
            "type": "string",
            "format": "date",
            "example": "2026-06-15"
          },
          "horaInicio": {
            "type": "string",
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
            "example": "10:00"
          },
          "horaFin": {
            "type": "string",
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
            "example": "12:00"
          },
          "numeroPlazas": {
            "type": "integer",
            "minimum": 1,
            "example": 4
          },
          "motivo": {
            "type": "string",
            "maxLength": 255,
            "example": "Reunión de equipo"
          },
          "observaciones": {
            "type": "string",
            "maxLength": 500,
            "example": "Se necesita proyector"
          }
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string",
            "example": "Datos de entrada inválidos"
          },
          "detalles": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "campo": {
                  "type": "string",
                  "example": "idRecurso"
                },
                "mensaje": {
                  "type": "string",
                  "example": "El recurso no está disponible en el horario seleccionado"
                }
              }
            }
          }
        }
      }
    }
  }
}, // Path to your OpenAPI YAML file
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      plugins: [
        SwaggerUIBundle.plugins.DownloadUrl
      ],
      layout: "StandaloneLayout"
    });
    // End Swagger UI call region

    window.ui = ui;
  };
</script>
</body>
</html>
